[project]
name = "radar-core"
version = "0.1.0"
description = "Núcleo común de la familia de radares (Vigía, Ojeador, Tasador)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Consumers install this package as a path dependency: without explicit
# cache-keys, uv only rebuilds when pyproject.toml's mtime changes and serves
# a stale wheel after source-only edits (verified with uv 0.11).
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "radar_core/**/*.py" }]

[tool.hatch.build.targets.wheel]
packages = ["radar_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
