[project]
name = "radar-core"
version = "0.1.0"
description = "Reusable runtime for resilient async polling services"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Oscar Aguilar Ramos" }]
requires-python = ">=3.12"
keywords = [
    "asyncio",
    "circuit-breaker",
    "rate-limiting",
    "resilience",
    "sqlite",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
]

[project.urls]
Homepage = "https://github.com/Arreketefo/radar-core"
Repository = "https://github.com/Arreketefo/radar-core"
Issues = "https://github.com/Arreketefo/radar-core/issues"
Changelog = "https://github.com/Arreketefo/radar-core/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.3",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Consumers install this package as a path dependency: without explicit
# cache-keys, uv only rebuilds when pyproject.toml's mtime changes and serves
# a stale wheel after source-only edits (verified with uv 0.11).
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "radar_core/**/*.py" }]

[tool.hatch.build.targets.wheel]
packages = ["radar_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
